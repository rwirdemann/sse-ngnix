<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protobuf Submit Demo</title>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.js"></script>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  textarea {
    width: 100%;
    height: 320px;
    font-family: monospace;
    font-size: 0.75rem;
    box-sizing: border-box;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
  }
  pre {
    background: #f4f4f4;
    padding: 1rem;
    font-size: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .error {
    color: #b00020;
  }
</style>
</head>
<body>
  <h1>Send ModbusConfig</h1>
  <textarea id="payload"></textarea>
  <br>
  <button id="send">Send</button>
  <h2>Response</h2>
  <pre id="result">–</pre>
  <h2>Confirmation</h2>
  <pre id="confirmation">–</pre>

  <script>
    const textarea = document.getElementById('payload');
    const result = document.getElementById('result');
    const confirmation = document.getElementById('confirmation');
    let root = null;
    let pollTimer = null;

    // pollInterval is how often the frontend polls
    // /config/confirmations/{transactionID} while a transaction is
    // still "received".
    const pollInterval = 1000;

    // randomUUID returns a random v4 UUID. crypto.randomUUID is only
    // available in secure contexts (https or localhost), so fall back
    // to building one from crypto.getRandomValues.
    function randomUUID() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
      return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' +
        hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
    }

    // defaultPayload builds the example ModbusConfig request shown in
    // the textarea, stamped with a fresh transaction ID.
    function defaultPayload(transactionId) {
      return {
        transactionId: transactionId,
        serviceName: 'modbus',
        neonpulseIds: ['1234'],
        modbusConfig: {
          transactionId: transactionId,
          neonpulseId: '1234',
          kontext: 'anlage-1',
          serials: [
            {
              url: '/dev/ttyUSB0',
              timeout: 1000,
              baud: 9600,
              dataBits: 8,
              parity: 'N',
              stopBits: 1,
              slaves: [
                {
                  address: 1,
                  name: 42,
                  fwVersion: '1.0.0',
                  type: 'dsl-x',
                  hardwareMaker: '',
                  hardwareModel: '',
                  spannungsebeneTeilanlage: 'MS',
                  rebirth: false,
                  scanRate: 500,
                  leittechnikkomponente: 3,
                },
              ],
            },
          ],
        },
      };
    }

    textarea.value = JSON.stringify(defaultPayload(randomUUID()), null, 2);

    // protoRoot lazily loads and caches the shared .proto
    // definitions served by nginx under /proto/.
    async function protoRoot() {
      if (!root) {
        root = await protobuf.load('/proto/messages.proto');
      }
      return root;
    }

    // packAny encodes obj as typeName and wraps the bytes in a
    // google.protobuf.Any message, as ServiceConfig.details expects.
    function packAny(root, typeName, obj) {
      const Type = root.lookupType(typeName);
      const message = Type.fromObject(obj);
      const bytes = Type.encode(message).finish();
      const Any = root.lookupType('google.protobuf.Any');
      return Any.create({
        type_url: 'type.googleapis.com/' + typeName,
        value: bytes,
      });
    }

    // toTimestamp converts a JS Date into a google.protobuf.Timestamp
    // {seconds, nanos} pair.
    function toTimestamp(date) {
      const millis = date.getTime();
      return {
        seconds: Math.floor(millis / 1000),
        nanos: (millis % 1000) * 1e6,
      };
    }

    // fromTimestamp converts a decoded {seconds, nanos} pair back
    // into an ISO date string for display.
    function fromTimestamp(ts) {
      if (!ts) return null;
      const millis = Number(ts.seconds) * 1000 + Math.round(ts.nanos / 1e6);
      return new Date(millis).toISOString();
    }

    // pollConfirmation polls GET /config/confirmations/{transactionID}
    // every pollInterval ms and updates the confirmation panel,
    // until the status is no longer "received".
    function pollConfirmation(root, transactionId) {
      if (pollTimer) clearTimeout(pollTimer);
      confirmation.classList.remove('error');
      confirmation.textContent = 'polling …';

      const Confirmation = root.lookupType('modbus_messages.Confirmation');

      const tick = async () => {
        try {
          const res = await fetch('/config/confirmations/' +
            encodeURIComponent(transactionId));
          const bytes = new Uint8Array(await res.arrayBuffer());
          if (!res.ok) {
            confirmation.textContent = res.status + ' ' + res.statusText + '\n' +
              new TextDecoder().decode(bytes);
            confirmation.classList.add('error');
            return;
          }

          const decoded = Confirmation.decode(bytes);
          const obj = Confirmation.toObject(decoded, { enums: String, defaults: true });
          obj.createdAt = fromTimestamp(obj.createdAt);
          confirmation.textContent = JSON.stringify(obj, null, 2);

          if (obj.status === 'received') {
            pollTimer = setTimeout(tick, pollInterval);
          }
        } catch (e) {
          confirmation.textContent = 'Polling failed: ' + e.message;
          confirmation.classList.add('error');
        }
      };

      tick();
    }

    document.getElementById('send').addEventListener('click', async () => {
      result.textContent = '…';
      result.classList.remove('error');
      confirmation.textContent = '–';
      confirmation.classList.remove('error');
      if (pollTimer) clearTimeout(pollTimer);

      let input;
      try {
        input = JSON.parse(textarea.value);
      } catch (e) {
        result.textContent = 'Invalid JSON: ' + e.message;
        result.classList.add('error');
        return;
      }

      try {
        const root = await protoRoot();
        const ServiceConfig = root.lookupType('modbus_messages.ServiceConfig');

        const details = packAny(root, 'modbus_messages.ModbusConfig', input.modbusConfig || {});
        const message = ServiceConfig.fromObject({
          createdAt: toTimestamp(new Date()),
          transactionId: input.transactionId,
          serviceName: input.serviceName,
          neonpulseIds: input.neonpulseIds,
        });
        message.details = details;

        const body = ServiceConfig.encode(message).finish();

        const neonpulseID = (input.neonpulseIds && input.neonpulseIds[0]) || '';
        const res = await fetch('/config/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-protobuf',
            'X-Message-Type': 'config',
            'X-Neonpulse-Id': neonpulseID,
          },
          body,
        });

        const responseBytes = new Uint8Array(await res.arrayBuffer());
        if (!res.ok) {
          result.textContent = res.status + ' ' + res.statusText + '\n' +
            new TextDecoder().decode(responseBytes);
          result.classList.add('error');
          return;
        }

        const Confirmation = root.lookupType('modbus_messages.Confirmation');
        const decoded = Confirmation.decode(responseBytes);
        const obj = Confirmation.toObject(decoded, { enums: String, defaults: true });
        obj.createdAt = fromTimestamp(obj.createdAt);
        result.textContent = res.status + ' ' + res.statusText + '\n' +
          JSON.stringify(obj, null, 2);

        pollConfirmation(root, input.transactionId);
      } catch (e) {
        result.textContent = 'Request failed: ' + e.message;
        result.classList.add('error');
      }
    });
  </script>
</body>
</html>
