worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;
lock_file  logs/nginx.lock;

events {
    worker_connections  1024;
}

http {
    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        application/json        json;
    }
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # Temp-Verzeichnisse innerhalb des Projekts, damit nginx ohne
    # root-Rechte laufen kann (Distro-Defaults liegen sonst meist
    # unter /var/lib/nginx).
    client_body_temp_path  logs/tmp/client-body;
    proxy_temp_path        logs/tmp/proxy;
    fastcgi_temp_path      logs/tmp/fastcgi;
    scgi_temp_path         logs/tmp/scgi;
    uwsgi_temp_path        logs/tmp/uwsgi;

    server {
        listen       8080;
        server_name  localhost;

        # Statische Seite
        location / {
            root   static;
            index  index.html;
        }

        # Reverse Proxy zum lokalen Go-Service. Der Client setzt den
        # Content-Type selbst (application/x-protobuf) und nginx
        # reicht ihn unveraendert durch.
        location /config/update {
            proxy_pass         http://127.0.0.1:9000/config/update;
            proxy_set_header   Host $host;
        }

        # Pollbarer Abfrage-Endpunkt fuer den Bestaetigungsstatus
        # einer Transaktion (/config/confirmations/{transactionID}).
        location /config/confirmations/ {
            proxy_pass         http://127.0.0.1:9000/config/confirmations/;
            proxy_set_header   Host $host;
        }

        # Stellt die gemeinsame .proto-Datei dem Browser zur
        # Verfuegung, damit protobuf.js die Nachrichten daraus laden
        # kann, ohne eine Kopie im static-Verzeichnis zu pflegen.
        location /proto/ {
            root .;
        }
    }
}
