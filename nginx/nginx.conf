worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        application/json        json;
    }
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # Statische Seite
        location / {
            root   static;
            index  index.html;
        }

        # Reverse Proxy zum lokalen Go-Service
        location /api/submit {
            proxy_pass         http://127.0.0.1:9000/submit;
            proxy_set_header   Host $host;
            proxy_set_header   Content-Type application/json;
        }

        # GET haelt einen SSE-Stream zum Browser offen, POST liefert
        # den Job-Abschluss vom settingsmanager an. Beides geht an
        # denselben confirmations-Service; Buffering muss aus, sonst
        # haelt nginx die Stream-Antwort zurueck statt sie
        # durchzureichen.
        location /confirmations {
            proxy_pass          http://127.0.0.1:9001/confirmations;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    Connection '';
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
        }
    }
}
